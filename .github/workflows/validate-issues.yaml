name: validate-issues

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue template marker (debug enabled)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;

            const body = (issue.body || "").trim();
            const title = (issue.title || "").trim();

            const INVALID_LABEL = "invalid";

            const MARK_GRANT = "<!-- grant-application-tpl:v1 -->";
            const MARK_GENERAL = "<!-- general-issue-tpl:v1 -->";

            const hasGrantMarker = body.includes(MARK_GRANT);
            const hasGeneralMarker = body.includes(MARK_GENERAL);

            console.log("---- DEBUG START ----");
            console.log("Issue number:", issue_number);
            console.log("Title:", title);
            console.log("Body length:", body.length);
            console.log("Has grant marker:", hasGrantMarker);
            console.log("Has general marker:", hasGeneralMarker);
            console.log("Full body preview (first 500 chars):");
            console.log(body.substring(0, 500));
            console.log("---- DEBUG END ----");

            const hasValidMarker = hasGrantMarker || hasGeneralMarker;

            const alreadyInvalid = (issue.labels || []).some(l => l.name === INVALID_LABEL);

            if (issue.state !== "open") {
              console.log("Issue not open, skipping.");
              return;
            }

            if (alreadyInvalid) {
              console.log("Issue already labeled invalid, skipping.");
              return;
            }

            if (!hasValidMarker) {

              console.log("No valid marker detected → marking as invalid.");

              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [INVALID_LABEL]
                });
              } catch (e) {
                console.log("Error adding label:", e.message);
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body:
                  "This issue was closed automatically because it does not use a supported issue template.\n\n" +
                  "Please create a new issue using one of the available templates."
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed"
              });

              console.log("Issue closed.");
            } else {
              console.log("Valid template marker detected. Issue allowed.");
            }
