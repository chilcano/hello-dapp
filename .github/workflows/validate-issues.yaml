name: validate-issues

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue template marker
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;

            const body = (issue.body || "").trim();
            const title = (issue.title || "").trim();

            const INVALID_LABEL = "invalid";

            const MARK_GRANT = "<!-- grant-application-tpl:v1 -->";
            const MARK_GENERAL = "<!-- general-issue-tpl:v1 -->";

            const hasValidMarker =
              body.includes(MARK_GRANT) ||
              body.includes(MARK_GENERAL);

            // If issue is already closed or already invalid, do nothing
            const alreadyInvalid = (issue.labels || []).some(l => l.name === INVALID_LABEL);
            if (issue.state !== "open" || alreadyInvalid) return;

            if (!hasValidMarker) {

              // Add invalid label
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [INVALID_LABEL]
                });
              } catch (e) {}

              // Comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body:
                  "This issue was closed automatically because it does not use a supported issue template.\n\n" +
                  "Please create a new issue using one of the available templates."
              });

              // Close issue
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed"
              });
            }
