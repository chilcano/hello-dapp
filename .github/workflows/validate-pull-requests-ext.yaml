name: validate-pull-requests-ext

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  validate-pr-ext:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR template fields (skip closing for org members)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prNumber = pr.number;
            const body = (pr.body || "");
            const authorAssociation = (pr.author_association || "").toUpperCase();
            const login = (pr.user?.login || "").toLowerCase();

            // Optional: skip bots (dependabot, etc.)
            if (login.endsWith("[bot]")) {
              core.info(`Skipping bot PR: ${login}`);
              return;
            }

            // Trusted users: we still VALIDATE (so you can test), but we won't close/label/comment.
            const TRUSTED = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const isTrusted = TRUSTED.has(authorAssociation);

            const INVALID_LABEL = "invalid";

            // Detect URLs + images
            // (Covers https://..., plus <img ...> and markdown images)
            const URL_RE = /\bhttps?:\/\/[^\s)>"]+/i;
            const MD_IMAGE_RE = /!\[[^\]]*]\([^)]*\)/;
            const HTML_IMAGE_RE = /<img\b[^>]*>/i;

            // Impact checkbox must be checked (case-insensitive), supports "-" or "*" bullets
            const IMPACT_CHECKED_RE = /^[\s>*-]*[-*]\s*\[[xX]\]\s*(critical|high|medium|low)\b/im;

            const invalid =
              !IMPACT_CHECKED_RE.test(body) ||
              URL_RE.test(body) ||
              MD_IMAGE_RE.test(body) ||
              HTML_IMAGE_RE.test(body);

            core.info(`PR#${prNumber} author_association=${authorAssociation} isTrusted=${isTrusted} invalid=${invalid}`);

            // If invalid but trusted, do not enforce (no label/comment/close)
            if (invalid && isTrusted) return;

            if (invalid) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: [INVALID_LABEL]
                });
              } catch (e) {
                core.info(`Could not add label '${INVALID_LABEL}': ${e.message}`);
              }

              const msg =
                `This PR was closed automatically because it does not comply with the repository submission rules.\n\n` +
                `Please open a new PR and fill the template properly.`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: msg
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: "closed"
              });
            }
